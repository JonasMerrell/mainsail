# Fork release: push a tag like v2.19.0-jm.1 and this builds mainsail.zip and attaches it to a
# GitHub release. Moonraker's update manager (`type: web`, `repo: JonasMerrell/mainsail`) installs it.
name: Fork release

on:
  push:
    tags:
      - 'v*-jm.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set package version from tag
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Build
        run: npm run build
        env:
          MAINSAIL_RELEASE_OWNER: ${{ github.repository_owner }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/mainsail.zip
          generate_release_notes: true
